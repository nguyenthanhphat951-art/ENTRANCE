<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIÊN BẢN KIỂM TRA ĐÁNH GIÁ ĐẦU VÀO HỌC VIÊN TOPNOTCH</title>
<style>
  :root { --navy: #1F3864; --light: #D6E4F0; --grey: #f4f6f9; --ok: #1e7e34; --sub-bg: #eaf1f8; --accent: #2e5b9e; }
  * { box-sizing: border-box; font-family: Arial, sans-serif; }
  body { margin: 0; background: var(--grey); color: #222; font-size: 13.5px; line-height: 1.4; }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 16px; }
  header { background: var(--navy); color: #fff; padding: 18px 24px; border-radius: 8px 8px 0 0; }
  header h1 { margin: 0; font-size: 20px; text-transform: uppercase; }
  .card { background: #fff; padding: 20px 24px; border: 1px solid #dde3ec; border-top: none; }
  
  .info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 20px; margin-bottom: 16px; }
  .info label { font-weight: bold; font-size: 12px; display: block; margin-bottom: 5px; color: var(--navy); }
  .info input, .info select { width: 100%; padding: 8px 10px; border: 1px solid #bbb; border-radius: 4px; font-size: 13.5px; }
  .info select { background: #fffde6; border-color: var(--navy); font-weight: bold; color: var(--navy); cursor: pointer; }
  
  .legend { font-size: 13px; background: #fffbe6; border: 1px solid #f0e2a0; padding: 12px 14px; border-radius: 6px; margin: 16px 0; color: #333; line-height: 1.5; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ccd4e0; padding: 8px 10px; vertical-align: top; }
  th { background: var(--navy); color: #fff; font-size: 13px; text-align: left; }
  .sec td { background: var(--light); font-weight: bold; font-size: 14px; color: var(--navy); text-transform: uppercase; padding: 10px; }
  .part-row td { background: #fff; font-size: 13px; }
  .part-title { font-weight: bold; color: var(--navy); margin-bottom: 4px; display: block; font-size: 13.5px; }
  .skill-desc { font-size: 12.5px; color: #444; }
  
  td.score { width: 85px; text-align: center; vertical-align: middle; }
  td.savg { width: 95px; text-align: center; font-weight: bold; background: #fafcff; font-size: 17px; color: var(--navy); vertical-align: middle; }
  input.sc { width: 65px; padding: 6px; text-align: center; border: 2px solid #e6c200; background: #fffde6; border-radius: 4px; font-size: 14.5px; font-weight: bold; }
  input.sc:focus { outline: 2px solid var(--navy); }
  
  .note-container { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 180px; }
  textarea.cm { width: 100%; flex: 1; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; padding: 8px; resize: vertical; display: block; font-family: inherit; line-height: 1.4; transition: 0.2s; }
  textarea.cm:focus { outline: none; border-color: var(--navy); }
  .cm-strong { background-color: #f6fdf6; border-left: 3px solid #28a745; }
  .cm-weak { background-color: #fffafa; border-left: 3px solid #dc3545; }
  
  .totals { display: flex; gap: 16px; margin-top: 20px; }
  .tot-box { flex: 1; background: var(--light); border-radius: 8px; padding: 16px 20px; text-align: center; }
  .tot-box .num { font-size: 32px; font-weight: bold; color: var(--navy); margin-top: 5px; }
  .tot-box .lbl { font-size: 12.5px; font-weight: bold; color: var(--navy); text-transform: uppercase; }
  
  .recommendation { margin-top: 20px; }
  .recommendation textarea { width: 100%; min-height: 90px; border: 1px solid #ccc; border-radius: 4px; padding: 10px; font-family: inherit; font-size: 13.5px; line-height: 1.5; }
  .btns { margin: 20px 0; display: flex; gap: 12px; justify-content: center; }
  button { background: var(--navy); color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
  button:hover { background: var(--accent); }
  @media print { .btns, .legend { display: none; } body { background: #fff; } .wrap { padding: 0; max-width: 100%; } textarea.cm { border: 1px solid #999; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BIÊN BẢN KIỂM TRA ĐÁNH GIÁ ĐẦU VÀO HỌC VIÊN - TOPNOTCH ENGLISH CENTRE</h1>
  </header>
  <div class="card">
    <div class="info">
      <div style="grid-column: span 2;">
        <label>Loại bài kiểm tra (Test Type)</label>
        <select id="test-type">
          <option value="starters">1. Cambridge Starters (Pre-A1)</option>
          <option value="movers">2. Cambridge Movers (A1)</option>
          <option value="flyers">3. Cambridge Flyers (A2)</option>
          <option value="ket">4. KET - A2 Key</option>
          <option value="pet">5. PET - B1 Preliminary</option>
          <option value="ielts" selected>6. IELTS </option>
          <option value="grammar">7. Ngữ pháp cơ bản </option>
          <option value="communication">8. Tiếng Anh Giao tiếp </option>
        </select>
      </div>
      <div><label>Ngày kiểm tra</label><input type="date"></div>
      <div><label>Người đánh giá</label><input placeholder="Giáo viên / Giám khảo..."></div>
      
      <div style="grid-column: span 2;"><label>Họ và tên học viên</label><input placeholder="Nhập tên học viên..."></div>
      <div><label>Ngày sinh</label><input type="date"></div>
      <div><label>SĐT / Mã học viên</label><input placeholder="0909xxxxxx / ID..."></div>
      
      <div style="grid-column: span 2;"><label>Mục tiêu học tập (Target)</label><input placeholder="Ví dụ: IELTS 6.5, KET Pass..."></div>
      <div style="grid-column: span 2;"><label>Lịch sử bài Test gần nhất (nếu có)</label><input placeholder="Điểm thi cũ, khóa học cũ..."></div>
    </div>

    <div class="legend" id="legend-text"></div>

    <table id="tbl">
      <thead>
        <tr>
          <th style="width: 18%">Phần thi (Parts)</th>
          <th style="width: 32%">Kỹ năng thể hiện (Demonstrated Skills)</th>
          <th style="width: 8%; text-align: center;">Điểm</th>
          <th style="width: 8%; text-align: center;">Quy đổi</th>
          <th style="width: 34%">Nhận xét: Điểm mạnh (+) & Điểm cần cải thiện (-)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="totals">
      <div class="tot-box">
        <div class="lbl" id="tot-raw-lbl">Tổng điểm gốc (Raw Score)</div>
        <div class="num" id="tot-raw">0</div>
      </div>
      <div class="tot-box">
        <div class="lbl" id="overall-lbl">Kết quả tổng quát (Overall)</div>
        <div class="num" id="tot-overall">0</div>
      </div>
    </div>

    <div class="recommendation">
      <label style="font-weight:bold; color:var(--navy); display:block; margin-bottom:6px;">Lộ trình học tập & Lớp đề xuất (dành cho Tư vấn):</label>
      <textarea placeholder="- Lớp học đề xuất: ...&#10;- Số tháng dự kiến: ...&#10;- Mục tiêu cần đạt sau khóa học: ...&#10;- Cảnh báo đặc biệt: ..."></textarea>
    </div>
    
    <div class="btns">
      <button onclick="window.print()">🖨 In / Lưu File PDF</button>
      <button style="background:#666;" onclick="clearForm()">Làm mới Form</button>
    </div>
  </div>
</div>

const tbody = document.querySelector("#tbl tbody");
const testTypeSel = document.getElementById("test-type");

function renderTable() {
  const typeKey = testTypeSel.value;
  const config = DATA[typeKey];
  document.getElementById("legend-text").innerHTML = `<b>Hướng dẫn:</b> ${config.legend}`;
  
  if (config.type === 'yle') { document.getElementById("overall-lbl").textContent = "Tổng số Khiên (Max 15)"; }
  else if (config.type === 'ielts') { document.getElementById("overall-lbl").textContent = "IELTS Overall Band"; }
  else if (config.type === 'general') { document.getElementById("overall-lbl").textContent = "Điểm Trung Bình (1-10)"; }
  else { document.getElementById("overall-lbl").textContent = "Tổng điểm các phần"; }
  
  tbody.innerHTML = "";
  config.sections.forEach((sec, sIdx) => {
    let tr = document.createElement("tr");
    tr.className = "sec";
    tr.innerHTML = `<td colspan="5">${sec.name}</td>`;
    tbody.appendChild(tr);

    let rowsCnt = sec.parts.length;
    sec.parts.forEach((p, pIdx) => {
      let r = document.createElement("tr");
      r.className = "part-row";
      
      let pName = `<span class="part-title">${p.n}</span>`;
      let pSkill = `<span class="skill-desc">${p.s}</span>`;
      
      let stepValue = (config.type==='ielts' && sec.isDirectBand) || config.type==='general' ? 0.5 : 1;
      let inp = `<input class="sc" data-sec="${sIdx}" type="number" min="0" max="${p.m}" step="${stepValue}" placeholder="Max ${p.m}">`;
      
      let avgCol = "";
      let noteCol = "";
      if (pIdx === 0) {
        let labelStr = config.type === 'yle' ? 'Khiên' : (config.type === 'ielts' ? 'Band' : (config.type === 'general' ? 'Điểm' : 'Điểm'));
        avgCol = `<td class="savg" rowspan="${rowsCnt}" id="avg${sIdx}">- ${labelStr}</td>`;
        noteCol = `<td rowspan="${rowsCnt}">
          <div class="note-container">
            <textarea class="cm cm-strong" placeholder="[+] ĐIỂM MẠNH: ..."></textarea>
            <textarea class="cm cm-weak" placeholder="[-] ĐIỂM CẦN CẢI THIỆN: ..."></textarea>
          </div>
        </td>`;
      }

      r.innerHTML = `<td>${pName}</td><td>${pSkill}</td><td class="score">${inp}</td>${avgCol}${noteCol}`;
      tbody.appendChild(r);
    });
  });
  calc();
}

function ieltsConvertL(sc) {
  if(sc>=39) return 9.0; if(sc>=37) return 8.5; if(sc>=35) return 8.0;
  if(sc>=32) return 7.5; if(sc>=30) return 7.0; if(sc>=26) return 6.5;
  if(sc>=23) return 6.0; if(sc>=18) return 5.5; if(sc>=16) return 5.0;
  if(sc>=13) return 4.5; if(sc>=10) return 4.0; if(sc>=8) return 3.5;
  if(sc>=6) return 3.0; if(sc>=4) return 2.5; return (sc>0)?2.0:0.0;
}
function ieltsConvertR(sc) {
  if(sc>=39) return 9.0; if(sc>=37) return 8.5; if(sc>=35) return 8.0;
  if(sc>=33) return 7.5; if(sc>=30) return 7.0; if(sc>=27) return 6.5;
  if(sc>=23) return 6.0; if(sc>=19) return 5.5; if(sc>=15) return 5.0;
  if(sc>=13) return 4.5; if(sc>=10) return 4.0; if(sc>=8) return 3.5;
  if(sc>=6) return 3.0; if(sc>=4) return 2.5; return (sc>0)?2.0:0.0;
}
function roundIelts(val) {
  let w = Math.floor(val), f = val - w;
  if(f >= 0.75) return w + 1.0;
  if(f >= 0.25) return w + 0.5;
  return w;
}

function calc() {
  const typeKey = testTypeSel.value;
  const config = DATA[typeKey];
  let grandTotalRaw = 0;
  let activeSecs = 0;
  let sumIeltsBands = 0;
  let sumShields = 0;
  let sumGeneralAvg = 0;

  config.sections.forEach((sec, sIdx) => {
    let inputs = [...document.querySelectorAll(`.sc[data-sec="${sIdx}"]`)];
    let sumRaw = 0;
    let hasVal = false;
    inputs.forEach(i => { 
      let v = parseFloat(i.value); 
      if(!isNaN(v)) { sumRaw += v; hasVal = true; } 
    });

    let avgEl = document.getElementById("avg" + sIdx);
    if (!hasVal) { avgEl.textContent = "-"; return; }

    grandTotalRaw += sumRaw;

    if (config.type === 'yle') {
      let result = 0;
      if (sec.isDirect) {
        result = sumRaw; 
      } else {
        let maxSec = sec.parts.reduce((a,b)=>a+b.m, 0);
        let pct = (sumRaw / maxSec) * 100;
        if (pct >= 80) result = 5;
        else if (pct >= 60) result = 4;
        else if (pct >= 40) result = 3;
        else if (pct >= 20) result = 2;
        else result = 1;
      }
      avgEl.innerHTML = `${result} <span style="font-size:12px; color:#c77700">★</span>`;
      sumShields += result;
    } 
    else if (config.type === 'ielts') {
      let band = 0;
      if (sec.isRawToBandL) band = ieltsConvertL(sumRaw);
      else if (sec.isRawToBandR) band = ieltsConvertR(sumRaw);
      else if (sec.isDirectBand) band = sumRaw / inputs.length; 
      
      avgEl.textContent = band.toFixed(1);
      sumIeltsBands += band;
      activeSecs++;
    } 
    else if (config.type === 'general') {
      let avg = sumRaw / inputs.length;
      avgEl.textContent = avg.toFixed(1);
      sumGeneralAvg += avg;
      activeSecs++;
    }
    else {
      let maxSec = sec.parts.reduce((a,b)=>a+b.m, 0);
      avgEl.textContent = `${sumRaw} / ${maxSec}`;
    }
  });

  document.getElementById("tot-raw").textContent = grandTotalRaw;
  let overallEl = document.getElementById("tot-overall");
  
  if (config.type === 'yle') {
    overallEl.innerHTML = `${sumShields} <span style="font-size:20px; color:#c77700">★</span>`;
  } else if (config.type === 'ielts') {
    if (activeSecs > 0) {
      overallEl.textContent = roundIelts(sumIeltsBands / activeSecs).toFixed(1);
    } else { overallEl.textContent = "0.0"; }
  } else if (config.type === 'general') {
    if (activeSecs > 0) {
      overallEl.textContent = (sumGeneralAvg / activeSecs).toFixed(1);
    } else { overallEl.textContent = "0.0"; }
  } else {
    overallEl.textContent = grandTotalRaw; 
  }
}

function clearForm() {
  if(confirm('Bạn có chắc chắn muốn xóa tất cả dữ liệu nhập trong Form?')){
    document.querySelectorAll('.sc, .cm').forEach(i => i.value = '');
    calc();
  }
}

testTypeSel.addEventListener("change", renderTable);
document.addEventListener("input", e => {
  if (e.target.classList.contains("sc")) {
    let max = parseFloat(e.target.getAttribute("max"));
    if (parseFloat(e.target.value) > max) e.target.value = max; 
    calc();
  }
});
renderTable();
</script>
